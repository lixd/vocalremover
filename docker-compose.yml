services:
  backend:
    image: ${DOCKER_REGISTRY:-lixd96}/vocalremover-backend:${IMAGE_TAG:-latest}
    container_name: vocalremover-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend-data:/app/media
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-key-change-in-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-false}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-*}

  worker:
    image: ${DOCKER_REGISTRY:-lixd96}/vocalremover-backend:${IMAGE_TAG:-latest}
    container_name: vocalremover-worker
    restart: unless-stopped
    volumes:
      - backend-data:/app/media
    environment:
      - WORKER_MODE=worker
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-key-change-in-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-false}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-*}
    depends_on:
      - backend

  frontend:
    image: ${DOCKER_REGISTRY:-lixd96}/vocalremover-frontend:${IMAGE_TAG:-latest}
    container_name: vocalremover-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  backend-data:
