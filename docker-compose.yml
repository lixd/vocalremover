services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vocalremover-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - backend-media:/app/media
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-key-change-in-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-false}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-*}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vocalremover-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  backend-media:
