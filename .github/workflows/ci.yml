name: Build and Push Docker Image

on:
  push:
    branches:
      - '**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Sanitize branch name for Docker tag
        id: sanitize
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          TAG_NAME=$(echo "$BRANCH_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          if [[ "$BRANCH_NAME" == "main" || "$BRANCH_NAME" == "master" ]]; then
            echo "is_main=true" >> $GITHUB_OUTPUT
          else
            echo "is_main=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/vocalremover-backend:${{ steps.sanitize.outputs.tag_name }}
            ${{ steps.sanitize.outputs.is_main == 'true' && format('{0}/vocalremover-backend:latest', secrets.DOCKERHUB_USERNAME) || '' }}
          no-cache: true

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/vocalremover-frontend:${{ steps.sanitize.outputs.tag_name }}
            ${{ steps.sanitize.outputs.is_main == 'true' && format('{0}/vocalremover-frontend:latest', secrets.DOCKERHUB_USERNAME) || '' }}
          no-cache: true
