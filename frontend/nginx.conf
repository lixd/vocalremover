server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # Vue SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Pass through Range headers for audio seeking
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # Disable buffering for audio streaming — critical for WaveSurfer.js playback
        proxy_buffering off;
        proxy_request_buffering off;

        # Support file uploads (20MB max)
        client_max_body_size 20M;

        # Longer timeout for audio operations
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Media files proxy to backend
    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static assets cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
