[project]
name = "audio-separator-backend"
version = "0.1.0"
description = "AI Audio Separator Backend"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0,<6.0",
    "djangorestframework>=3.15,<4.0",
    "django-cors-headers>=4.4,<5.0",
    "spleeter>=2.4,<3.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
    # spleeter excluded on macOS ARM64: tensorflow 2.12.1 has no arm64 wheels
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
